[project]
name = "Neuron-Boxing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "neat-python>=2.0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
[tool.ruff]
line-length = 100